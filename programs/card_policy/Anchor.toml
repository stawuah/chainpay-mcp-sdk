# card_policy has its own Anchor + Cargo workspace (contracts.md CD-1).
# Build from this directory: `anchor build` (or `cargo build-sbf`).
[toolchain]
anchor_version = "1.1.2"

[workspace]
members = ["."]

[features]
resolution = true
skip-lint = false

[programs.devnet]
card_policy = "Cz9vYKFZFwx8Bqag95xZtw8dqUjS4k9AoyMh1pFo82F"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"
