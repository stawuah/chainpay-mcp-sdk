# card_policy has its own Anchor + Cargo workspace (contracts.md CD-1).
# Build from this directory: `anchor build` (or `cargo build-sbf`).
[toolchain]
anchor_version = "1.1.2"

[workspace]
members = ["."]

[features]
resolution = true
skip-lint = false

[programs.devnet]
card_policy = "H3aetJdQXG8EeJSCHZrpQa8iKHBw8e1p9fSPjTUsB93n"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"
