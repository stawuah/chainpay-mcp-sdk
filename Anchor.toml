[toolchain]
anchor_version = "1.1.2"

[workspace]
# programs/card_policy is its own Anchor + Cargo workspace (built from that
# directory). Keep it out of this one so build/keys commands here never touch it.
exclude = ["programs/card_policy"]

[features]
resolution = true
skip-lint = false

# Only ChainPay is built by `anchor build`. The support splitter has its own build
# (make splitter-test, and DEPLOY.md for real builds); including it here would also
# let `anchor build` rewrite its declare_id.
[workspace]
members = ["programs/chainpay"]

[programs.devnet]
chainpay = "3H9TV1EPR2BAQgVmcMqpufiZKPXbAMnjHp13LA9Lndv4"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[hooks]
