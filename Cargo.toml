[workspace]
resolver = "2"
members = ["backend", "programs/chainpay"]
default-members = ["backend", "programs/chainpay"]
# card_policy is its own Cargo workspace (own Cargo.lock) so the MagicBlock ER
# SDK pins never touch this lockfile. Build it from programs/card_policy.
exclude = ["programs/card_policy"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
