[package]
name = "chainpay-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "relay"
path = "api/relay.rs"
required-features = ["vercel"]

[features]
vercel = ["dep:vercel_runtime", "dep:tower"]

[dependencies]
vercel_runtime = { version = "2.4", features = ["axum"], optional = true }
tower = { version = "0.5", optional = true }
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
solana-transaction = { version = "=4.2.0", features = ["wincode", "serde", "verify"] }
# Already reached transitively through solana-transaction; named here because
# transaction validation refers to CompiledInstruction directly.
solana-message = { version = "=4.6.0", features = ["wincode"] }
wincode = "0.6"
solana-address = { version = "2", features = ["curve25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
solana-message = { version = "=4.6.0", features = ["wincode"] }
