name: PayPal extension checks
on:
  pull_request:
    branches: ['paypal/**']
permissions:
  contents: read
concurrency:
  group: paypal-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p chainpay-backend --features paypal --locked
