name: Cards reconcile
# Drives the card connector's reconcile job (contracts.md §3.4) on the relay
# where cards are switched on. Since 2026-10-04 that is the production relay
# (the public Devnet MVP; the release check allows cards there only with
# Solana Devnet and the Lithic sandbox). A Vercel cron is not used: a */10
# schedule fails a Hobby-plan deploy. The job also finishes card activations
# and public commitments that were still waiting on the base layer.
#
# Off until configured. Needs, in the repository settings:
#   variable CARDS_RECONCILE_URL   the relay origin running the card connector, e.g. https://chainpay-relay.vercel.app
#   secret   CARDS_CRON_SECRET     that relay's CRON_SECRET (16+ characters)
#   secret   VERCEL_AUTOMATION_BYPASS_SECRET  only if that deployment is protected
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: cards-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.CARDS_RECONCILE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one reconcile pass
        env:
          RELAY: ${{ vars.CARDS_RECONCILE_URL }}
          CRON_SECRET: ${{ secrets.CARDS_CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "CARDS_CRON_SECRET is not set"; exit 1; }
          headers=(-H "authorization: Bearer $CRON_SECRET")
          if [ -n "$BYPASS" ]; then headers+=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          # The report is counts only (no card data); print it for the run log.
          curl -fsS --max-time 90 -X POST "${headers[@]}" "${RELAY%/}/internal/cron/cards/reconcile"
          echo
