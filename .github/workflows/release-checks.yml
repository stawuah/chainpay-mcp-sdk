name: Release checks
on:
  pull_request:
  push:
    branches: [master, release/vercel-convex-reviewed]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix sdk run build
      - run: npm run check
      - run: npm run check:convex
      - run: npm run test:convex
      - run: npm run test:migration
      - run: node --test scripts/check-release-env.test.mjs
      - run: npm --prefix sdk test
      - run: npm --prefix mcp-server test
      - run: npm --prefix demo-merchant test
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chainpay_test
          POSTGRES_DB: chainpay_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U chainpay_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chainpay_test@127.0.0.1:55439/chainpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p chainpay-backend --locked -- --ignored --test-threads=1
      - run: cargo check -p chainpay-backend --features vercel --locked
      - run: cargo check --manifest-path deploy/relay/Cargo.toml --locked
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql openssl
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: npm run test:migration:integration
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix sdk run build
      - run: npx --prefix frontend playwright install --with-deps chrome chromium
      - name: Rendered receipt, request and connector regressions
        run: |
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5189 > /tmp/vite.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:5189/ > /dev/null && break; sleep 1; done
          npm --prefix frontend run test:verify-public-browser
          npm --prefix frontend run test:receipts-owner-browser
          npm --prefix frontend run test:permission-request-browser
          npm --prefix frontend run test:crossmint-browser
