services:
  - type: web
    name: chainpay-backend
    runtime: rust
    plan: free
    buildCommand: cargo build --release -p chainpay-backend
    startCommand: ./target/release/chainpay-backend
    healthCheckPath: /healthz
    envVars:
      - key: CHAINPAY_CLUSTER
        value: devnet
      - key: CHAINPAY_RPC_URL
        sync: false
      - key: CHAINPAY_PROGRAM_ID
        value: 3H9TV1EPR2BAQgVmcMqpufiZKPXbAMnjHp13LA9Lndv4
      - key: CHAINPAY_HTTP_AUTH_TOKEN
        value: ""
      - key: CHAINPAY_ALLOWED_ORIGINS
        value: "*"
  - type: web
    name: chainpay-mcp
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npm --prefix sdk run build && npm --prefix mcp-server run build
    startCommand: node mcp-server/dist/http.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHAINPAY_RPC_URL
        value: https://chainpay-backend.onrender.com/rpc
      - key: CHAINPAY_PROGRAM_ID
        value: 3H9TV1EPR2BAQgVmcMqpufiZKPXbAMnjHp13LA9Lndv4
      - key: CHAINPAY_BACKEND_URL
        value: https://chainpay-backend.onrender.com 
      - key: CHAINPAY_BACKEND_AUTH_TOKEN
        value: ""
      - key: CHAINPAY_HTTP_AUTH_TOKEN
        value: ""
      - key: CHAINPAY_ALLOWED_ORIGINS
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHAINPAY_AI_PROVIDER
        value: openrouter
      - key: CHAINPAY_AGENT_MODEL
        value: openrouter/free
  - type: web
    name: chainpay-frontend
    runtime: static
    plan: free
    buildCommand: npm ci --ignore-scripts && npm --prefix sdk run build && npm ci --prefix frontend --ignore-scripts && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CHAINPAY_BACKEND_URL
        value: https://chainpay-backend.onrender.com
      - key: VITE_CHAINPAY_RPC_URL
        value: https://chainpay-backend.onrender.com/rpc
      - key: VITE_CHAINPAY_MCP_URL
        value: https://chainpay-mcp.onrender.com/mcp
      - key: VITE_CHAINPAY_AGENT_URL
        value: https://chainpay-mcp.onrender.com/agent/chat
